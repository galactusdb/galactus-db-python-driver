[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galactus-db-python-driver"
version = "0.2.0"
description = "Dependency-free Bolt 5.4 and 4.4 driver for Galactus DB"
requires-python = ">=3.10"
dependencies = []
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["galactus"]

[project.urls]
Homepage = "https://galactusdb.com"
Repository = "https://github.com/galactusdb/galactus-db-python-driver"
